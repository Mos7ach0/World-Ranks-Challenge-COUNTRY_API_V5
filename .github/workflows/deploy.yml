name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download countries
        env:
          REST_COUNTRIES_API_KEY: ${{ secrets.REST_COUNTRIES_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, mkdirSync } from 'node:fs'

          const key = (process.env.REST_COUNTRIES_API_KEY || '').trim()
          if (!key) { console.error('Falta el secret REST_COUNTRIES_API_KEY'); process.exit(1) }

          const FIELDS = [
            'names.common', 'flag.url_svg', 'population', 'area.kilometers',
            'region', 'subregion', 'classification.sovereign', 'classification.un_member',
          ].join(',')

          const all = []
          for (let offset = 0; ; ) {
            const url = `https://api.restcountries.com/countries/v5?response_fields=${FIELDS}&limit=100&offset=${offset}`
            const res = await fetch(url, { headers: { Authorization: `Bearer ${key}` } })
            if (!res.ok) {
              console.error(`Error ${res.status}: ${(await res.text()).slice(0, 200)}`)
              process.exit(1)
            }
            const { data } = await res.json()
            const objects = data?.objects ?? []
            all.push(...objects)
            console.log(`offset ${offset}: +${objects.length} (total ${all.length}/${data?.meta?.total ?? '?'})`)
            if (!data?.meta?.more || objects.length === 0) break
            offset += objects.length
          }

          if (all.length === 0) { console.error('La API no devolvio paises'); process.exit(1) }
          mkdirSync('public', { recursive: true })
          writeFileSync('public/countries.json', JSON.stringify(all))
          console.log(`Guardados ${all.length} paises`)
          JS

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
